<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kỷ Yếu 12A4 K60 - Thanh Xuân Rực Rỡ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background: #0f172a; }
        .rainbow-header { background: linear-gradient(135deg, #FF6B6B, #FF8E53, #FFD93D, #6BCB77, #4D96FF, #9D4EDD); background-size: 300% 300%; animation: gradientShift 8s ease infinite; }
        @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .card-glass { background: rgba(255, 255, 255, 0.07); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.15); }
    </style>
</head>
<body class="text-white min-h-screen pb-24">
    <div class="rainbow-header text-white p-6 rounded-b-[3rem] shadow-2xl text-center relative overflow-hidden">
        <span class="bg-black/30 text-yellow-300 font-extrabold text-[11px] px-4 py-1.5 rounded-full uppercase tracking-widest border border-white/20">
            <i class="fa-solid fa-bolt text-yellow-400 mr-1"></i> Khóa 60 • Kỷ Yếu 12A4
        </span>
        <h1 class="text-4xl font-black mt-3 tracking-tight">12A4 K60</h1>
        <p class="text-xs text-white/90 font-medium mt-1">Lưu giữ trọn vẹn những năm tháng rực rỡ nhất!</p>
    </div>
    <div class="max-w-md mx-auto px-4 mt-6 space-y-6">
        <div class="grid grid-cols-2 gap-2 bg-slate-900/80 p-2 rounded-2xl border border-slate-700 shadow-xl">
            <button onclick="switchTab('photos')" id="btn-photos" class="py-3 text-xs font-black rounded-xl transition bg-gradient-to-r from-pink-500 to-rose-500 text-white shadow-lg flex items-center justify-center gap-2">
                <i class="fa-solid fa-images text-sm"></i> ALBUM ẢNH
            </button>
            <button onclick="switchTab('messages')" id="btn-messages" class="py-3 text-xs font-black rounded-xl transition text-slate-400 hover:text-white flex items-center justify-center gap-2">
                <i class="fa-solid fa-envelope-open-text text-sm"></i> LƯU BÚT
            </button>
        </div>
        <div id="tab-photos" class="space-y-4">
            <div class="card-glass p-5 rounded-3xl shadow-2xl space-y-3 border-t-2 border-pink-400">
                <h2 class="font-black text-sm flex items-center gap-2 text-pink-400"><i class="fa-solid fa-camera-retro text-lg"></i> Thêm Khoảnh Khắc Mới</h2>
                <div class="space-y-3">
                    <label class="block w-full border-2 border-dashed border-pink-500/40 hover:border-pink-400 rounded-2xl p-4 text-center cursor-pointer transition bg-pink-500/10">
                        <i class="fa-solid fa-cloud-arrow-up text-3xl text-pink-400 mb-1"></i>
                        <span id="file-label" class="block text-xs text-pink-200 font-bold">Chạm để chọn ảnh từ thư viện</span>
                        <input type="file" id="imgFile" accept="image/*" onchange="updateFileName()" class="hidden">
                    </label>
                    <input type="text" id="imgTitle" placeholder="Tiêu đề (VD: Sinh nhật lớp...)" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-3 text-xs text-white">
                    <input type="text" id="imgAuthor" placeholder="Tên của bạn..." class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-3 text-xs text-white">
                    <button onclick="savePhoto()" class="w-full py-3.5 rounded-xl font-black text-xs uppercase bg-gradient-to-r from-pink-500 to-indigo-500 text-white shadow-xl">Đăng Lên Ngay</button>
                </div>
            </div>
            <div id="photoList" class="space-y-4"></div>
        </div>
        <div id="tab-messages" class="space-y-4 hidden">
            <div class="card-glass p-5 rounded-3xl shadow-2xl space-y-3 border-t-2 border-yellow-400">
                <h2 class="font-black text-sm flex items-center gap-2 text-yellow-400"><i class="fa-solid fa-pen-nib text-lg"></i> Viết Lời Chúc / Lưu Bút</h2>
                <input type="text" id="msgAuthor" placeholder="Tên của bạn..." class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-3 text-xs text-white">
                <textarea id="msgContent" rows="3" placeholder="Nhắn gửi những yêu thương..." class="w-full bg-slate-900/90 border border-slate-700 rounded-xl px-4 py-3 text-xs text-white"></textarea>
                <button onclick="saveMessage()" class="w-full py-3.5 rounded-xl font-black text-xs uppercase bg-gradient-to-r from-yellow-500 to-pink-500 text-white shadow-xl">Gửi Gắm Yêu Thương</button>
            </div>
            <div id="messageList" class="space-y-3"></div>
        </div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";
        const firebaseConfig = {
            apiKey: "HÃY_ĐIỀN_API_KEY_CỦA_BẠN",
            authDomain: "kyyeu12a4k60.firebaseapp.com",
            projectId: "kyyeu12a4k60",
            storageBucket: "kyyeu12a4k60.firebasestorage.app"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);
        let photos = [], messages = [];
        onSnapshot(query(collection(db, "photos"), orderBy("createdAt", "desc")), (s) => {
            photos = s.docs.map(d => ({ id: d.id, ...d.data() }));
            renderAll();
        });
        onSnapshot(query(collection(db, "messages"), orderBy("createdAt", "desc")), (s) => {
            messages = s.docs.map(d => ({ id: d.id, ...d.data() }));
            renderAll();
        });
        window.updateFileName = () => {
            const input = document.getElementById("imgFile");
            if (input.files[0]) document.getElementById("file-label").innerText = "✨ " + input.files[0].name;
        };
        window.switchTab = (tab) => {
            const isPhotos = tab === 'photos';
            document.getElementById('tab-photos').classList.toggle('hidden', !isPhotos);
            document.getElementById('tab-messages').classList.toggle('hidden', isPhotos);
            document.getElementById('btn-photos').className = isPhotos ? "py-3 text-xs font-black rounded-xl bg-gradient-to-r from-pink-500 to-rose-500 text-white shadow-lg flex items-center justify-center gap-2" : "py-3 text-xs font-black rounded-xl text-slate-400 hover:text-white flex items-center justify-center gap-2";
            document.getElementById('btn-messages').className = !isPhotos ? "py-3 text-xs font-black rounded-xl bg-gradient-to-r from-yellow-500 to-orange-500 text-white shadow-lg flex items-center justify-center gap-2" : "py-3 text-xs font-black rounded-xl text-slate-400 hover:text-white flex items-center justify-center gap-2";
        };
        function renderAll() {
            const pList = document.getElementById("photoList");
            pList.innerHTML = photos.length === 0 ? `<div class="text-center py-12 text-slate-400 text-xs card-glass rounded-3xl border border-dashed border-pink-500/30">Album chưa có bức ảnh nào.</div>` : photos.map(p => `
                <div class="card-glass rounded-3xl overflow-hidden border border-white/10">
                    <img src="${p.url}" class="w-full h-72 object-cover">
                    <div class="p-4 space-y-2">
                        <p class="font-bold text-sm text-pink-300">${p.title}</p>
                        <div class="flex justify-between items-center text-[11px] text-slate-300 pt-2 border-t border-white/10">
                            <span><i class="fa-solid fa-user text-yellow-400 mr-1"></i>${p.author}</span>
                            <button onclick="delPhoto('${p.id}', '${p.path}')" class="text-rose-400 px-3 py-1 bg-rose-500/20 rounded-xl font-bold flex items-center gap-1"><i class="fa-solid fa-trash"></i> Xóa</button>
                        </div>
                    </div>
                </div>
            `).join("");
            const mList = document.getElementById("messageList");
            mList.innerHTML = messages.length === 0 ? `<div class="text-center py-12 text-slate-400 text-xs card-glass rounded-3xl border border-dashed border-yellow-500/30">Lưu bút trống.</div>` : messages.map(m => `
                <div class="card-glass p-4 rounded-2xl border border-white/10 relative">
                    <button onclick="delMsg('${m.id}')" class="absolute top-3 right-3 text-slate-400 hover:text-rose-400 text-xs"><i class="fa-solid fa-trash"></i></button>
                    <div class="flex items-center gap-2 mb-2">
                        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-yellow-400 to-orange-500 text-slate-950 font-black flex items-center justify-center text-xs">${m.author.charAt(0).toUpperCase()}</div>
                        <span class="font-extrabold text-xs text-yellow-300">${m.author}</span>
                    </div>
                    <p class="text-xs text-slate-200 leading-relaxed pl-10 font-medium">${m.content}</p>
                </div>
            `).join("");
        }
        window.savePhoto = async () => {
            const fileInput = document.getElementById("imgFile");
            const title = document.getElementById("imgTitle").value.trim();
            const author = document.getElementById("imgAuthor").value.trim();
            if (!fileInput.files[0] || !title || !author) return alert("Vui lòng điền đủ thông tin!");
            try {
                const file = fileInput.files[0];
                const path = `photos/${Date.now()}_${file.name}`;
                const storageRef = ref(storage, path);
                await uploadBytes(storageRef, file);
                const url = await getDownloadURL(storageRef);
                await addDoc(collection(db, "photos"), { url, path, title, author, createdAt: new Date() });
                fileInput.value = "";
                document.getElementById("imgTitle").value = "";
                document.getElementById("imgAuthor").value = "";
                document.getElementById("file-label").innerText = "Chạm để chọn ảnh từ thư viện";
                alert("✨ Đăng ảnh thành công!");
            } catch (e) { alert("Lỗi: " + e.message); }
        };
        window.saveMessage = async () => {
            const author = document.getElementById("msgAuthor").value.trim();
            const content = document.getElementById("msgContent").value.trim();
            if (!author || !content) return alert("Vui lòng điền đủ thông tin!");
            await addDoc(collection(db, "messages"), { author, content, createdAt: new Date() });
            document.getElementById("msgAuthor").value = "";
            document.getElementById("msgContent").value = "";
            alert("💖 Đã gửi lưu bút thành công!");
        };
        window.delPhoto = async (id, path) => {
            if (confirm("Bạn có chắc muốn xóa ảnh này?")) {
                await deleteDoc(doc(db, "photos", id));
                try { await deleteObject(ref(storage, path)); } catch (e) {}
            }
        };
        window.delMsg = async (id) => {
            if (confirm("Bạn có chắc muốn xóa lưu bút này?")) await deleteDoc(doc(db, "messages", id));
        };
    </script>
</body>
</html>
